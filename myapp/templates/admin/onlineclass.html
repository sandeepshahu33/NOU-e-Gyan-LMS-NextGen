{% extends "admin/adminbase.html" %}
{% block title %}Schedule Google Meet Class{% endblock %}
{% block extra_css %}<style>
      .meeting-form-container {
        font-family: "Poppins", sans-serif;
        background: #ffffff;
        padding: 24px 35px 30px;
        border-radius: 0 0 22px 22px;
        box-sizing: border-box;
        width: 100%;
        color: #26364a;
      }

      .meeting-form-container *,
      .meeting-form-container *::before,
      .meeting-form-container *::after {
        box-sizing: border-box;
      }

      .meeting-form-container .form-divider {
        height: 1px;
        background: #e9edf2;
        border: none;
        margin: 0 0 24px;
      }

      .meeting-form-container .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 25px;
        row-gap: 19px;
      }

      .meeting-form-container .form-group {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .meeting-form-container .form-group.full-width {
        grid-column: 1 / -1;
      }

      .meeting-form-container label {
        font-size: 16px;
        font-weight: 600;
        color: #26364a;
        margin-bottom: 9px;
      }

      .meeting-form-container input,
      .meeting-form-container select,
      .meeting-form-container textarea {
        width: 100%;
        min-width: 0;
        font-family: "Poppins", sans-serif;
        font-size: 16px;
        font-weight: 400;
        color: #172b45;
        background-color: #ffffff;
        border: 1px solid #d9e1ed;
        border-radius: 15px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .meeting-form-container input,
      .meeting-form-container select {
        height: 63px;
        padding: 0 19px;
      }

      .meeting-form-container textarea {
        min-height: 165px;
        padding: 17px 19px;
        resize: vertical;
      }

      .meeting-form-container input::placeholder,
      .meeting-form-container textarea::placeholder {
        color: #8793a4;
        opacity: 1;
      }

      .meeting-form-container input:focus,
      .meeting-form-container select:focus,
      .meeting-form-container textarea:focus {
        border-color: #b31e35;
        box-shadow: 0 0 0 3px rgba(179, 30, 53, 0.08);
      }

      .meeting-form-container .meet-connect-top {
        margin-bottom: 23px;
      }

      .meeting-form-container .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 29px;
      }

      .meeting-form-container .btn {
        min-height: 50px;
        padding: 13px 19px;
        border-radius: 12px;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .meeting-form-container .btn-primary {
        color: #ffffff;
        border: none;
        background: linear-gradient(110deg, #85152f, #d74719);
        box-shadow: 0 9px 22px rgba(120, 25, 40, 0.12);
      }

      .meeting-form-container .btn-secondary {
        color: #34465d;
        background: #ffffff;
        border: 1px solid #d9e1ed;
      }

      .meeting-form-container .btn:hover {
        transform: translateY(-1px);
      }

      .meeting-form-container .btn-primary:hover {
        box-shadow: 0 10px 25px rgba(120, 25, 40, 0.2);
      }

      .meeting-form-container .error-message {
        color: #c62828;
        font-size: 13px;
        margin-top: 5px;
      }

      @media (max-width: 768px) {
        .meeting-form-container {
          padding: 20px 18px 25px;
        }

        .meeting-form-container .form-grid {
          grid-template-columns: 1fr;
          row-gap: 17px;
        }

        .meeting-form-container .form-group.full-width {
          grid-column: auto;
        }

        .meeting-form-container input,
        .meeting-form-container select {
          height: 56px;
          font-size: 15px;
        }

        .meeting-form-container textarea {
          min-height: 130px;
          font-size: 15px;
        }

        .meeting-form-container .form-actions {
          flex-direction: column;
        }

        .meeting-form-container .btn {
          width: 100%;
        }
      }
    </style>{% endblock %}
{% block content %}
<div class="meeting-form-container">
      <hr class="form-divider" />

      <!-- Connect Google Meet -->
      <div class="meet-connect-top">
        <a href="{% url 'google_login' %}"
          ><button type="button" class="btn btn-primary">
            Connect Google Meet
          </button></a
        >
      </div>

      <form method="POST" action="{% url 'schedule_meeting' %}">
        {% csrf_token %}

        <div class="form-grid">
          <!-- Class Title -->
          <div class="form-group">
            <label for="class_title">Class Title</label>
            <input
              type="text"
              id="class_title"
              name="class_title"
              maxlength="200"
              placeholder="e.g. Python Functions - Live Class"
              required
            />
          </div>

          <!-- Course -->
          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select Course</option>

              {% for item in courses %}
              <option value="{{ item.course_name }}">
                {{ item.course_name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
              <option value="">Select Subject</option>

              {% for item in subjects %}
              <option value="{{ item.subject_name }}">
                {{ item.subject_name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Teacher -->
          <div class="form-group">
            <label for="teacher">Teacher</label>
            {% if fixed_teacher %}
              <input type="text" id="teacher_display" value="{{ fixed_teacher.get_full_name|default:fixed_teacher.username }}" readonly />
            {% else %}
              <select id="teacher" name="teacher" required>
                <option value="">Select Teacher</option>
                {% for item in teachers %}
                <option value="{{ item.user_id }}">{{ item.user.username }} ({{ item.user.email|default:item.email }})</option>
                {% endfor %}
              </select>
            {% endif %}
          </div>

          <!-- Class Date -->
          <div class="form-group">
            <label for="class_date">Class Date</label>
            <input type="date" id="class_date" name="class_date" required />
          </div>

          <!-- Class Time -->
          <div class="form-group">
            <label for="class_time">Class Time</label>
            <input type="time" id="class_time" name="class_time" required />
          </div>

          <!-- Duration -->
          <div class="form-group">
            <label for="duration">Duration (Minutes)</label>
            <input
              type="number"
              id="duration"
              name="duration"
              value="60"
              min="1"
              required
            />
          </div>

          <!-- Agenda -->
          <div class="form-group full-width">
            <label for="agenda">Agenda</label>
            <textarea
              id="agenda"
              name="agenda"
              placeholder="Topics to be covered..."
            ></textarea>
          </div>
        </div>

        <!-- Form Buttons -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            Schedule Google Meet Class
          </button>

          <button type="button" class="btn btn-secondary">
            Connect Google Meet
          </button>
        </div>
      </form>
    </div>
{% endblock %}
